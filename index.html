<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YFL League · Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050c1f; --bg2:#0b1a39; --panel:rgba(13,24,54,.82); --panel2:rgba(25,44,96,.78);
    --line:rgba(255,255,255,.08); --text:#eef2fb; --muted:#93a3c6; --red:#e3192b; --blue:#3d7bff; --acc:#3d7bff; --acc2:#9fc2ff;
    --gold:#ffc425; --silver:#c8d0dc; --bronze:#d08a3e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Poppins,system-ui,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh;
    background:
      radial-gradient(1200px 600px at 90% -10%,rgba(43,109,255,.35),transparent 60%),
      radial-gradient(900px 500px at -10% 110%,rgba(80,60,255,.22),transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 60%);
    background-attachment:fixed}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 2px),rgba(255,255,255,.035) calc(8.333% - 2px) 8.333%)}
  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 20px 60px}
  .topbar{height:6px;background:linear-gradient(90deg,#1b4fd6,#7fb0ff,#c9d4e6)}
  header{display:flex;align-items:center;gap:18px;padding:26px 0 18px;flex-wrap:wrap}
  .logo{width:78px;height:78px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #6fa8ff,0 0 28px rgba(43,109,255,.7)}
  .logo-fallback{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font:italic 800 26px Poppins;
    background:linear-gradient(180deg,#e3192b,#7a0b12);box-shadow:0 0 0 3px #fff}
  .brand small{display:block;color:var(--gold);letter-spacing:.35em;font-weight:700;font-size:13px}
  .brand h1{font:italic 800 clamp(28px,5vw,46px)/1.05 Poppins;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .brand p{color:var(--muted);font-size:13px;margin-top:4px}
  .season{margin-left:auto}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:600 14px Poppins}
  nav{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
  nav a{color:var(--muted);text-decoration:none;font:italic 700 15px Poppins;text-transform:uppercase;padding:12px 16px;
    border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  nav a.on{color:#fff;border-color:var(--acc)}
  nav a:hover{color:#fff}
  section{display:none} section.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(6px)}
  .card h3{font:italic 700 16px Poppins;text-transform:uppercase;padding:11px 16px;
    background:linear-gradient(90deg,#1f55e0,rgba(31,85,224,0) 85%);display:flex;justify-content:space-between;align-items:center}
  .card h3 button{font:600 11px Poppins;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:20px;padding:4px 10px;cursor:pointer;font-style:normal}
  .card h3 button:hover{background:rgba(255,255,255,.25)}
  .rows{padding:10px}
  .row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;margin-bottom:6px;background:var(--panel2);cursor:pointer;position:relative;overflow:hidden}
  .row:nth-child(even){background:rgba(17,31,68,.85)}
  .row:hover{outline:1px solid rgba(255,255,255,.25)}
  .row .rk{font:italic 800 19px Poppins;width:22px;text-align:center;color:var(--muted)}
  .row .nm{flex:1;min-width:0}
  .row .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .row .val{font:italic 800 20px Poppins}
  .row.m1{background:linear-gradient(90deg,rgba(255,196,37,.32),rgba(17,31,68,.85) 75%)} .row.m1 .rk,.row.m1 .val{color:var(--gold)}
  .row.m2{background:linear-gradient(90deg,rgba(200,208,220,.22),rgba(17,31,68,.85) 75%)} .row.m2 .rk{color:var(--silver)}
  .row.m3{background:linear-gradient(90deg,rgba(208,138,62,.25),rgba(17,31,68,.85) 75%)} .row.m3 .rk{color:var(--bronze)}
  .row.m1:before,.row.m2:before,.row.m3:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .row.m1:before{background:var(--gold)} .row.m2:before{background:var(--silver)} .row.m3:before{background:var(--bronze)}
  .empty{color:var(--muted);text-align:center;padding:26px;font-size:14px}
  .min{font-size:11px;color:var(--muted);padding:0 16px 10px}
  .posbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .posbar a{flex:none;text-decoration:none;color:var(--muted);font:italic 700 13px Poppins;text-transform:uppercase;
    padding:9px 16px;border-radius:30px;background:var(--panel);border:1px solid var(--line)}
  .posbar a:hover{color:#fff}
  .posbar a.on{color:#fff;background:linear-gradient(90deg,#1f55e0,#3d7bff);border-color:transparent;box-shadow:0 4px 18px rgba(61,123,255,.35)}
  h2.pt{font:italic 800 26px Poppins;text-transform:uppercase;margin:4px 0 12px}
  h2.pt span{color:var(--acc2)}
  td.rk{font:italic 800 15px Poppins;color:var(--muted);width:40px}
  tr.r1 td.rk{color:var(--gold)} tr.r2 td.rk{color:var(--silver)} tr.r3 td.rk{color:var(--bronze)}
  tr.r1{background:linear-gradient(90deg,rgba(255,196,37,.13),transparent 60%)}
  td.hl{font-weight:700;color:#fff}
  th:nth-child(2),td:nth-child(2){text-align:left}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--text);font:500 15px Poppins}
  .tbl{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font:600 11.5px Poppins;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:12px 12px;
    background:rgba(5,11,28,.6);cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  th.sorted{color:#fff} th.sorted:after{content:" ▼";font-size:9px}
  td{padding:11px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
  tbody tr{cursor:pointer} tbody tr:hover{background:rgba(255,255,255,.04)}
  td .tm{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
  td b{font-weight:600}
  .games{display:grid;gap:14px}
  .game summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .game summary::-webkit-details-marker{display:none}
  .game .wk{font:italic 700 12px Poppins;background:var(--acc);padding:3px 10px;border-radius:20px;text-transform:uppercase}
  .game .score{font:italic 800 19px Poppins;flex:1}
  .game .meta{color:var(--muted);font-size:12px}
  .box{padding:0 18px 16px}
  .box .ln{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
  .box .ln b{min-width:180px;font-weight:600;cursor:pointer}
  .box .ln span{color:var(--muted)}
  .box h4{font:italic 700 13px Poppins;text-transform:uppercase;color:var(--gold);margin:12px 0 4px}
  .modal{position:fixed;inset:0;background:rgba(2,6,16,.75);backdrop-filter:blur(4px);display:none;z-index:10;padding:30px 14px;overflow-y:auto}
  .modal.on{display:block}
  .sheet{max-width:820px;margin:0 auto;background:linear-gradient(180deg,#0d1a3d,#070f26);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
  .sheet .hd{padding:24px 26px;background:linear-gradient(110deg,rgba(31,85,224,.75),rgba(11,26,57,.4))}
  .sheet .hd h2{font:italic 800 32px Poppins;line-height:1.1;word-break:break-all}
  .sheet .hd p{color:#dfe6f7;font-size:14px;margin-top:4px}
  .x{position:absolute;right:14px;top:12px;background:rgba(0,0,0,.35);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:20px 22px}
  .cat{background:var(--panel2);border-radius:14px;padding:12px 14px}
  .cat h4{font:italic 700 13px Poppins;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}
  .kv span{color:var(--muted)} .kv b{font-weight:600}
  .sheet .sec{padding:0 22px 22px}
  .sheet .sec h4{font:italic 700 14px Poppins;text-transform:uppercase;margin:4px 0 10px}
  .confs{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
  .conf h3 .dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-1px}
  .conf.nfc h3{background:linear-gradient(90deg,#1f55e0,rgba(31,85,224,0) 85%)}
  .conf.afc h3{background:linear-gradient(90deg,#c8102e,rgba(200,16,46,0) 85%)}
  .conf table td,.conf table th{padding:10px 14px}
  .tmname{display:flex;align-items:center;gap:10px;font-weight:600}
  .tmbar{width:5px;height:26px;border-radius:3px;flex:none}
  .seed{font:italic 800 14px Poppins;color:var(--muted);width:18px}
  @media (max-width:600px){ .confs{grid-template-columns:1fr} }
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:40px}
  @media (max-width:600px){ .brand h1{font-size:28px} .grid{grid-template-columns:1fr} .season{margin-left:0} }
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAT = Object.fromEntries(DATA.stats.map(s => [s.key, s]));
const CATS = ["Passing","Rushing","Receiving","Defense","Kicking"];
let S = DATA.seasons.find(s => s.season === DATA.current) || DATA.seasons[0];

const num = (v, dec=0, suf="") => v == null ? "—" : Number(v).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}) + suf;
const fmtV = v => Number.isInteger(v) ? num(v) : num(v,1);

// header
$("#leagueName").textContent = DATA.league.toUpperCase();
$("#leagueName2").textContent = DATA.league;
$("#updated").textContent = "Updated " + new Date(DATA.updated).toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
if (!$("#logo").getAttribute("src")) {
  const d = document.createElement("div"); d.className = "logo-fallback"; d.textContent = DATA.league.split(" ")[0].slice(0,4).toUpperCase();
  $("#logo").replaceWith(d);
}
$("#season").innerHTML = DATA.seasons.map(s => `<option value="${s.season}">Season ${s.season}</option>`).join("");
$("#season").value = S.season;
$("#season").onchange = e => { S = DATA.seasons.find(s => s.season == e.target.value); renderAll(); };

// tabs
const POS_KEYS = ["passing","rushing","receiving","dline","secondary","special","all"];
let POSITION = "passing";
function route(){
  let id = (location.hash || "#home").slice(1);
  if (POS_KEYS.includes(id)) { POSITION = id; renderStats(); id = "stats"; }
  if (!["home","stats","standings","scores"].includes(id)) id = "home";
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "tab-" + id));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on",
    id === "stats" ? a.hasAttribute("data-stats") : a.hash === "#" + id));
  scrollTo(0, 0);
}
addEventListener("hashchange", route);

// ---------- leaders
function rowHTML(r, i, b){
  return `<div class="row ${i<3 ? "m"+(i+1) : ""}" onclick="openPlayer(${JSON.stringify(r.name).replace(/"/g,"&quot;")})">
    <div class="rk">${i+1}</div>
    <div class="nm"><b>${esc(r.name)}</b><span>${esc(r.team || "Free Agent")}</span></div>
    <div class="val">${num(r.value, b.dec, b.suffix)}</div></div>`;
}
function renderBoards(){
  $("#boards").innerHTML = S.boards.map((b, bi) => `
    <div class="card"><h3>${esc(b.label)} ${b.rows.length > 5 ? `<button onclick="openBoard(${bi})">Top ${b.rows.length}</button>` : ""}</h3>
      <div class="rows">${b.rows.length ? b.rows.slice(0,5).map((r,i) => rowHTML(r,i,b)).join("") : `<div class="empty">No stats yet</div>`}</div>
      ${b.min ? `<div class="min">${esc(b.min)}</div>` : ""}</div>`).join("");
}
function openBoard(bi){
  const b = S.boards[bi];
  $("#sheet").innerHTML = `<button class="x" onclick="closeModal()">×</button>
    <div class="hd"><h2>${esc(b.label)}</h2><p>Season ${S.season} · Top ${b.rows.length}${b.min ? " · " + esc(b.min) : ""}</p></div>
    <div class="rows" style="padding:18px">${b.rows.map((r,i) => rowHTML(r,i,b)).join("")}</div>`;
  showModal();
}

// ---------- position stats (ACFL-style)
const r1 = v => v == null ? null : Math.round(v * 10) / 10;
const POS = {
  passing:  {label:"Passing", sort:"pass_yds", show:p => p.att > 0, cols:[
    ["comp","CMP"],["att","ATT"],["comp_pct","CMP%",1,"%"],["pass_yds","YDS"],["ypa","Y/A",1],["pass_td","TD"],
    ["ints_thrown","INT"],["sacked","SCKD"],["passer_rating","RTG",1]]},
  rushing:  {label:"Rushing", sort:"rush_yds", show:p => p.rush_att > 0 || p.rush_yds, cols:[
    ["rush_att","CAR"],["rush_yds","YDS"],["ypc","AVG",1],["rush_td","TD"],["ypg_rush","YDS/G",1]]},
  receiving:{label:"Receiving", sort:"rec_yds", show:p => p.rec > 0 || p.targets > 0, cols:[
    ["rec","REC"],["targets","TGT"],["catch_pct","CATCH%",1,"%"],["rec_yds","YDS"],["ypr","AVG",1],["rec_td","TD"],["drops","DROPS"]]},
  dline:    {label:"D-Line", sort:"sacks", show:p => p.tackles > 0 || p.sacks > 0 || p.ff > 0, cols:[
    ["tackles","TKL"],["sacks","SACKS",1],["ff","FF"],["fr","FR"],["def_td","TD"]]},
  secondary:{label:"Secondary", sort:"def_int", show:p => p.def_int > 0 || p.pass_def > 0, cols:[
    ["def_int","INT"],["pass_def","PD"],["tackles","TKL"],["def_td","TD"]]},
  special:  {label:"Special Teams", sort:"fgm", show:p => p.fga > 0 || p.xpa > 0 || p.ret_yds > 0, cols:[
    ["fgm","FGM"],["fga","FGA"],["fg_pct","FG%",1,"%"],["xpm","XPM"],["xpa","XPA"],["ret_yds","RET YDS"],["ret_td","RET TD"]]},
  all:      {label:"All Players", sort:"total_td", show:p => true, cols:[
    ["pass_yds","PASS YDS"],["pass_td","PASS TD"],["rush_yds","RUSH YDS"],["rec","REC"],["rec_yds","REC YDS"],
    ["tackles","TKL"],["sacks","SACKS",1],["def_int","INT"],["total_td","TOTAL TD"]]},
};
let sortKey = null;
function enrich(p){
  return {...p, ypa: p.att ? r1(p.pass_yds / p.att) : null, catch_pct: p.targets ? r1(p.rec / p.targets * 100) : null,
          ypg_rush: p.games ? r1(p.rush_yds / p.games) : null};
}
$("#posbar").innerHTML = POS_KEYS.map(k => `<a href="#${k}" data-pos="${k}">${POS[k].label}</a>`).join("");
function renderStats(){
  const P = POS[POSITION], key = sortKey && P.cols.some(c => c[0] === sortKey) ? sortKey : P.sort;
  document.querySelectorAll("#posbar a").forEach(a => a.classList.toggle("on", a.dataset.pos === POSITION));
  $("#ptitle").innerHTML = `<span>${esc(P.label)}</span> stats · Season ${S.season}`;
  const q = $("#q").value.trim().toLowerCase();
  let rows = S.players.map(enrich).filter(P.show)
    .filter(p => !q || p.name.toLowerCase().includes(q) || (p.team||"").toLowerCase().includes(q));
  rows.sort((a,b) => (b[key] ?? -1) - (a[key] ?? -1) || a.name.localeCompare(b.name));
  const cell = (p,[k,,dec,suf]) => {
    const v = p[k];
    const txt = v == null ? "—" : (v === 0 ? '<span style="opacity:.35">0</span>' : num(v, dec ?? (Number.isInteger(v)?0:1), suf || ""));
    return `<td class="${k===key?"hl":""}">${txt}</td>`;
  };
  $("#ptable").innerHTML = `<thead><tr><th>#</th><th>Player</th><th>GP</th>${P.cols.map(([k,l]) =>
      `<th data-k="${k}" class="${k===key?"sorted":""}">${l}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((p,i) => `<tr class="${i<3?"r"+(i+1):""}" onclick="openPlayer(${JSON.stringify(p.name).replace(/"/g,"&quot;")})">
      <td class="rk">${i+1}</td><td><b>${esc(p.name)}</b><span class="tm">${esc(p.team || "Free Agent")}</span></td>
      <td>${p.games}</td>${P.cols.map(c => cell(p,c)).join("")}</tr>`).join("")
      || `<tr><td colspan="${P.cols.length+3}" class="empty">No ${esc(P.label.toLowerCase())} stats yet</td></tr>`}</tbody>`;
  document.querySelectorAll("#ptable th[data-k]").forEach(th => th.onclick = () => { sortKey = th.dataset.k; renderStats(); });
}
$("#q").oninput = renderStats;

// ---------- player card
function openPlayer(name){
  const p = S.players.find(x => x.name === name);
  if (!p) return;
  const extra = {Passing:[["comp_pct","Comp %","%",1],["passer_rating","Passer Rating","",1]],
                 Rushing:[["ypc","Yards / Carry","",1]], Receiving:[["ypr","Yards / Catch","",1]], Kicking:[["fg_pct","FG %","%",1]]};
  const cats = CATS.map(c => {
    const items = DATA.stats.filter(s => s.cat === c && p[s.key]).map(s => `<div class="kv"><span>${esc(s.label)}</span><b>${fmtV(p[s.key])}</b></div>`);
    if (!items.length) return "";
    (extra[c]||[]).forEach(([k,l,suf,d]) => { if (p[k] != null) items.push(`<div class="kv"><span>${l}</span><b>${num(p[k],d,suf)}</b></div>`); });
    return `<div class="cat"><h4>${c === "Kicking" ? "Special Teams" : c}</h4>${items.join("")}</div>`;
  }).join("");
  const log = S.games.filter(g => g.lines.some(l => l.name === name)).map(g => {
    const l = g.lines.find(l => l.name === name);
    return `<div class="ln"><b>${gameTitle(g)}</b><span>${lineText(l.stats)}</span></div>`;
  }).join("");
  $("#sheet").innerHTML = `<button class="x" onclick="closeModal()">×</button>
    <div class="hd"><h2>${esc(p.name)}</h2><p>${esc(p.team || "Free Agent")} · Season ${S.season} · ${p.games} game${p.games==1?"":"s"}</p></div>
    <div class="cats">${cats || '<div class="empty">No stats</div>'}</div>
    ${log ? `<div class="sec box"><h4>Game log</h4>${log}</div>` : ""}`;
  showModal();
}
function lineText(st){
  return DATA.stats.filter(s => st[s.key] != null).map(s => `${s.short} ${fmtV(st[s.key])}`).join(" · ");
}
function gameTitle(g){
  const wk = g.week ? `Wk ${esc(g.week)} · ` : "";
  if (g.home || g.away) return `${wk}${esc(g.home||"?")} ${g.hs ?? "?"} – ${g.as ?? "?"} ${esc(g.away||"?")}`;
  return `${wk}Game #${g.id}`;
}
function showModal(){ $("#modal").classList.add("on"); document.body.style.overflow = "hidden"; }
function closeModal(){ $("#modal").classList.remove("on"); document.body.style.overflow = ""; }
addEventListener("keydown", e => e.key === "Escape" && closeModal());

// ---------- standings
const TEAM_COLORS = {"Arizona Cardinals":"#97233F","Atlanta Falcons":"#A71930","Baltimore Ravens":"#241773","Buffalo Bills":"#00338D",
  "Carolina Panthers":"#0085CA","Chicago Bears":"#C83803","Cincinnati Bengals":"#FB4F14","Cleveland Browns":"#FF3C00",
  "Dallas Cowboys":"#869397","Denver Broncos":"#FB4F14","Detroit Lions":"#0076B6","Green Bay Packers":"#FFB612",
  "Houston Texans":"#A71930","Indianapolis Colts":"#002C5F","Jacksonville Jaguars":"#006778","Kansas City Chiefs":"#E31837",
  "Las Vegas Raiders":"#A5ACAF","Los Angeles Chargers":"#0080C6","Los Angeles Rams":"#FFA300","Miami Dolphins":"#008E97",
  "Minnesota Vikings":"#4F2683","New England Patriots":"#C60C30","New Orleans Saints":"#D3BC8D","New York Giants":"#0B2265",
  "New York Jets":"#125740","Philadelphia Eagles":"#004C54","Pittsburgh Steelers":"#FFB612","San Francisco 49ers":"#AA0000",
  "Seattle Seahawks":"#69BE28","Tampa Bay Buccaneers":"#D50A0A","Tennessee Titans":"#4B92DB","Washington Commanders":"#773141"};
const teamColor = t => TEAM_COLORS[t] || Object.entries(TEAM_COLORS).find(([k]) => t && k.toLowerCase().includes(t.toLowerCase()))?.[1] || "#3d7bff";
const pct = t => { const g = t.w + t.l + t.t; return g ? (t.w + t.t / 2) / g : 0; };
const rec = t => `${t.w}-${t.l}${t.t ? "-" + t.t : ""}`;
function renderStandings(){
  const C = DATA.conf_standings;
  if (C && C.conferences && C.conferences.length) {
    $("#tab-standings").innerHTML = `<h2 class="pt"><span>Official</span> Standings · Regular Season</h2><div class="confs">${
      C.conferences.map(c => {
        const teams = [...c.teams].sort((a,b) => pct(b) - pct(a) || b.w - a.w || a.l - b.l);
        const cls = (c.short || "").toLowerCase();
        return `<div class="card conf ${cls}"><h3><span><span class="dot" style="background:${cls==="afc"?"#ff4d5e":"#5fb0ff"}"></span>${esc(c.name)}</span></h3>
          <div class="tbl" style="border:0;border-radius:0;background:none"><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>PCT</th><th>REC</th></tr></thead>
          <tbody>${teams.map((t,i) => `<tr class="${i===0?"r1":""}"><td><div class="tmname"><span class="seed">${i+1}</span>
            <span class="tmbar" style="background:${teamColor(t.team)}"></span>${esc(t.team)}</div></td>
            <td>${t.w}</td><td>${t.l}</td><td>${t.t}</td><td>${pct(t).toFixed(3).replace(/^0/,"")}</td><td class="hl">${rec(t)}</td></tr>`).join("")}</tbody></table></div></div>`;
      }).join("")}</div>`;
    return;
  }
  const st = S.standings;
  $("#tab-standings").innerHTML = `<div class="tbl"><table id="stable"></table></div>`;
  $("#stable").innerHTML = st.length ? `<thead><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th><th>Diff</th></tr></thead>
    <tbody>${st.map((t,i) => `<tr><td><b>${i+1}. ${esc(t.team)}</b></td><td>${t.w}</td><td>${t.l}</td><td>${t.t}</td><td>${t.pf}</td><td>${t.pa}</td>
      <td style="color:${t.pf-t.pa>=0?"#5be38a":"#ff6b6b"}">${t.pf-t.pa>0?"+":""}${t.pf-t.pa}</td></tr>`).join("")}</tbody>`
    : `<tbody><tr><td class="empty">No standings yet.</td></tr></tbody>`;
}

// ---------- games
function renderGames(){
  $("#glist").innerHTML = S.games.length ? S.games.map(g => {
    const teams = {};
    g.lines.forEach(l => (teams[l.team || "Players"] ||= []).push(l));
    return `<details class="card game"><summary><span class="wk">${g.week ? "Week " + esc(g.week) : "Game #" + g.id}</span>
      <span class="score">${(g.home||g.away) ? `${esc(g.home||"?")} ${g.hs ?? "?"} – ${g.as ?? "?"} ${esc(g.away||"?")}` : g.lines.length + " players"}</span>
      <span class="meta">${esc(g.date)} · tap for box score</span></summary>
      <div class="box">${Object.entries(teams).map(([t, ls]) => `<h4>${esc(t)}</h4>` + ls.map(l =>
        `<div class="ln"><b onclick="openPlayer(${JSON.stringify(l.name).replace(/"/g,"&quot;")})">${esc(l.name)}</b><span>${lineText(l.stats)}</span></div>`).join("")).join("")}</div></details>`;
  }).join("") : `<div class="card empty">No games yet</div>`;
}

function renderAll(){ renderBoards(); renderStats(); renderStandings(); renderGames(); }
renderAll(); route();
</script>
</body>
